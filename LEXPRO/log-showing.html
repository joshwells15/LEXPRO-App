<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>LexPro | Log a Showing</title>
<style>
  :root {
    --bg:#ffffff; --surface:#f7f7f7; --border:#e8e8e8;
    --primary:#111111; --text:#111111; --text-muted:#666666; --text-hint:#999999;
    --green:#1a7f37; --red:#cc2233;
    --font:'Outfit',-apple-system,sans-serif; --r-sm:10px; --r-md:14px; --r-lg:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{min-height:100vh;background:var(--bg);font-family:var(--font);color:var(--text);}
  .header{padding:18px 20px 12px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);}
  .back-btn{width:42px;height:42px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0;}
  .back-btn svg{width:18px;height:18px;stroke:var(--text-muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .page-title{font-size:22px;font-weight:700;letter-spacing:-0.3px;}
  .page-sub{font-size:12px;color:var(--text-hint);margin-top:2px;}
  .form{padding:20px;max-width:480px;margin:0 auto;}
  .label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-hint);margin:18px 0 8px;}
  .label:first-child{margin-top:0;}
  select,input{width:100%;padding:13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);font-family:var(--font);font-size:15px;color:var(--text);}
  .hint{font-size:11.5px;color:var(--text-hint);margin-top:6px;line-height:1.4;}
  .row{display:flex;gap:10px;}
  .row > div{flex:1;}
  .submit{width:100%;margin-top:26px;padding:16px;background:var(--primary);color:#fff;border:none;border-radius:var(--r-md);font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;}
  .submit:disabled{opacity:0.5;}
  .msg{text-align:center;font-size:13px;margin-top:12px;min-height:16px;}
  .msg.ok{color:var(--green);font-weight:600;} .msg.err{color:var(--red);}
</style>
</head>
<body>

<div class="header">
  <a class="back-btn" href="listings.html" onclick="if(document.referrer&&history.length>1){history.back();return false;}">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div>
    <div class="page-title">Log a Showing</div>
    <div class="page-sub">For showings booked by phone</div>
  </div>
</div>

<div class="form">
  <div class="label">Which property?</div>
  <select id="listingSel"><option value="">Loading listings…</option></select>

  <div class="label">Showing agent's name</div>
  <input id="agentName" placeholder="Kathleen Haworth" autocomplete="off">

  <div class="label">Agent's cell phone</div>
  <input id="agentPhone" type="tel" placeholder="(417) 555-1234" autocomplete="off">
  <div class="hint">Double-check this one — the automatic feedback follow-ups text this number.</div>

  <div class="row">
    <div>
      <div class="label">Date</div>
      <input id="showDate" type="date">
    </div>
    <div>
      <div class="label">Time</div>
      <input id="showTime" type="time">
    </div>
  </div>

  <button class="submit" id="submitBtn" onclick="submit()">Log Showing</button>
  <div class="msg" id="msg"></div>
</div>

<script>
  const user = JSON.parse(localStorage.getItem('lexpro_user') || sessionStorage.getItem('lexpro_user') || '{}');
  if (!user.username) window.location.href = 'index.html';

  const $ = id => document.getElementById(id);

  // default the date to today
  $('showDate').value = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });

  async function loadListings() {
    try {
      const r = await fetch('/.netlify/functions/listing-rules');
      const d = await r.json();
      const listings = (d.listings || []).filter(l => l.status === 'active');
      $('listingSel').innerHTML = '<option value="">Pick the property…</option>' +
        listings.map(l => `<option value="${l.id}">${l.address_full.split(',')[0]} — ${l.seller_name || ''}</option>`).join('');
    } catch (e) {
      $('listingSel').innerHTML = '<option value="">Could not load listings</option>';
    }
  }
  loadListings();

  window.submit = async () => {
    const msg = $('msg');
    const body = {
      listing_id: $('listingSel').value,
      agent_name: $('agentName').value.trim(),
      agent_phone: $('agentPhone').value.trim(),
      showing_date: $('showDate').value,
      showing_time: $('showTime').value
    };
    if (!body.listing_id) return err('Pick the property');
    if (!body.agent_name) return err("Agent's name is required");
    if (body.agent_phone.replace(/\D/g,'').length < 10) return err('A full agent phone number is required');
    if (!body.showing_date || !body.showing_time) return err('Date and time are required');

    $('submitBtn').disabled = true;
    msg.className = 'msg'; msg.textContent = 'Logging…';
    try {
      const r = await fetch('/.netlify/functions/log-showing', {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error);
      msg.className = 'msg ok';
      msg.textContent = `Logged ✓ — feedback follow-ups will run automatically`;
      $('agentName').value = ''; $('agentPhone').value = ''; $('showTime').value = '';
      $('listingSel').value = '';
      $('submitBtn').disabled = false;
    } catch (e) {
      err(e.message);
    }
    function _(){}
  };

  function err(t) {
    const msg = $('msg');
    msg.className = 'msg err'; msg.textContent = t;
    $('submitBtn').disabled = false;
  }
</script>
</body>
</html>
