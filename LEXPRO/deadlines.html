<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LexPro">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>LexPro | Deadlines</title>
<style>
  :root {
    --bg:#ffffff; --surface:#f7f7f7; --surface-2:#f0f0f0; --border:#e8e8e8;
    --primary:#111111; --text:#111111; --text-muted:#666666; --text-hint:#999999;
    --font:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif;
    --radius-sm:10px; --radius-md:14px; --radius-lg:20px;
    --green:#065F46; --green-bg:#D1FAE5; --amber:#78350F; --amber-bg:#FEF3C7;
    --red:#991B1B; --red-bg:#FEE2E2; --blue:#1E40AF; --blue-bg:#DBEAFE;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { min-height:100vh; min-height:100dvh; background:var(--bg); font-family:var(--font); color:var(--text); display:flex; flex-direction:column; }
  .topbar { padding:14px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .back-btn { width:34px; height:34px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center; text-decoration:none; flex-shrink:0; }
  .back-btn svg { width:16px; height:16px; stroke:var(--text-muted); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .topbar-info { flex:1; }
  .topbar-title { font-size:17px; font-weight:700; letter-spacing:-0.3px; }
  .topbar-sub { font-size:11px; color:var(--text-hint); margin-top:1px; }
  .wrap { flex:1; overflow-y:auto; padding:16px; max-width:560px; width:100%; margin:0 auto; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; gap:14px; }
  .pill-card { border:1.5px solid var(--border); border-radius:var(--radius-lg); background:var(--bg); overflow:hidden; }
  .pill-card.pop-ok { overflow:visible; }
  .pill-card.pop-ok .pill-header { border-radius:calc(var(--radius-lg) - 2px) calc(var(--radius-lg) - 2px) 0 0; }
  .pill-header { padding:13px 16px; background:var(--surface); border-bottom:1px solid var(--border);
    font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em; }
  .pill-body { padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
  .field { display:flex; flex-direction:column; gap:5px; }
  .field-label { font-size:11px; font-weight:600; color:var(--text-hint); text-transform:uppercase; letter-spacing:0.06em; }
  .field input, .field select, .field textarea {
    border:1.5px solid var(--border); border-radius:var(--radius-md); padding:11px 12px; font-family:var(--font);
    font-size:15px; color:var(--text); background:var(--surface); outline:none; width:100%; appearance:none; -webkit-appearance:none; }
  .field input:focus, .field select:focus { border-color:var(--primary); background:var(--bg); }
  .frow { display:flex; gap:10px; }
  .frow .field { flex:1; }
  .sel-wrap { position:relative; }
  .sel-wrap::after { content:'▾'; position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--text-hint); pointer-events:none; }
  .addr-banner { border:1.5px solid var(--primary); border-radius:var(--radius-lg); padding:14px 16px; background:var(--surface); display:none; }
  .addr-banner.show { display:block; }
  .ab-label { font-size:10px; font-weight:600; color:var(--text-hint); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:3px; }
  .ab-addr { font-size:16px; font-weight:700; line-height:1.35; }
  .ab-seller { font-size:12px; color:var(--text-muted); margin-top:2px; }
  .seg { display:flex; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:3px; }
  .seg-btn { flex:1; padding:9px; border:none; border-radius:999px; background:none; font-family:var(--font);
    font-size:13px; font-weight:600; color:var(--text-hint); cursor:pointer; transition:background 0.15s, color 0.15s; }
  .seg-btn.on { background:var(--primary); color:#fff; }
  .radio-group { display:flex; flex-direction:column; gap:8px; }
  .radio-opt { display:flex; align-items:center; gap:10px; padding:12px 14px; border:1.5px solid var(--border);
    border-radius:var(--radius-md); cursor:pointer; font-size:14px; font-weight:500; background:var(--surface);
    transition:border-color 0.15s, background 0.15s, color 0.15s; user-select:none; }
  .radio-opt.selected { border-color:var(--primary); background:var(--primary); color:#fff; }
  .radio-dot { width:16px; height:16px; border-radius:50%; border:2px solid currentColor; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .radio-dot::after { content:''; width:8px; height:8px; border-radius:50%; background:currentColor; opacity:0; }
  .radio-opt.selected .radio-dot::after { opacity:1; }
  .yn-group { display:flex; gap:10px; }
  .yn-btn { flex:1; padding:11px; border:1.5px solid var(--border); background:var(--surface); border-radius:var(--radius-md);
    font-family:var(--font); font-size:14px; font-weight:600; color:var(--text-hint); cursor:pointer; transition:all 0.15s; }
  .yn-btn.selected { border-color:var(--primary); background:var(--primary); color:#fff; }
  .big-btn { background:var(--primary); border:1.5px solid #fff; outline:1px solid var(--border); color:#fff;
    border-radius:var(--radius-lg); padding:14px; font-family:var(--font); font-size:15px; font-weight:600;
    cursor:pointer; transition:background 0.15s, color 0.15s; width:100%; }
  @media (hover:hover) { .big-btn:hover { background:#fff; color:var(--primary); border-color:var(--primary); } }
  .big-btn:active { background:#fff; color:var(--primary); }
  .big-btn:disabled { background:var(--surface-2); color:var(--text-hint); border-color:var(--border); cursor:not-allowed; }
  .toast { display:none; position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#111; color:#fff;
    padding:11px 20px; border-radius:12px; font-size:14px; font-weight:500; z-index:200; white-space:nowrap; }
  .toast.show { display:block; }
  .toast.success { background:var(--green); }
  .toast.error { background:#DC2626; }

  .contact-box { position:relative; }
  .results { position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--bg);
    border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:0 8px 24px rgba(0,0,0,0.1);
    z-index:80; max-height:260px; overflow-y:auto; display:none; }
  .results.open { display:block; }
  .result-item { padding:11px 14px; cursor:pointer; border-bottom:1px solid var(--border); }
  .result-item:last-child { border-bottom:none; }
  .result-item:active { background:var(--surface); }
  @media (hover:hover) { .result-item:hover { background:var(--surface); } }
  .result-name { font-size:14px; font-weight:600; }
  .result-phone { font-size:12px; color:var(--text-hint); margin-top:1px; }
  .selected-chip { display:none; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:8px 12px; font-size:13px; font-weight:600; width:fit-content; max-width:100%; }
  .selected-chip.show { display:flex; }
  .chip-x { background:none; border:none; font-family:var(--font); font-size:15px; color:var(--text-hint); cursor:pointer; line-height:1; }
  .dl-list { display:flex; flex-direction:column; gap:8px; }
  .dl-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 14px;
    border:1.5px solid var(--border); border-radius:var(--radius-md); background:var(--surface); }
  .dl-row.urgent { border-color:#FECACA; background:#FEF2F2; }
  .dl-row.soon { border-color:#FDE68A; background:#FFFBEB; }
  .dl-row.closing { border-color:#BFDBFE; background:#EFF6FF; }
  .dl-label { font-size:14px; font-weight:600; }
  .dl-row.urgent .dl-label { color:var(--red); }
  .dl-row.soon .dl-label { color:var(--amber); }
  .dl-row.closing .dl-label { color:var(--blue); }
  .dl-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .dl-date { font-size:13px; color:var(--text-muted); }
  .dl-badge { font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .b-urgent { background:var(--red-bg); color:var(--red); }
  .b-soon { background:var(--amber-bg); color:var(--amber); }
  .b-ok { background:var(--green-bg); color:var(--green); }
  .b-closing { background:var(--blue-bg); color:var(--blue); }
  .dl-empty { font-size:13px; color:var(--text-hint); text-align:center; padding:20px 0; }
</style>
</head>
<body>
<div class="topbar">
  <a class="back-btn" href="crm-sellers.html" id="backBtn">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <div class="topbar-info">
    <div class="topbar-title">⏳ Deadlines</div>
    <div class="topbar-sub">Transaction dates & urgency</div>
  </div>
</div>
<div class="wrap">
  <div class="pill-card pop-ok">
    <div class="pill-header">Contact</div>
    <div class="pill-body">
      <div class="field contact-box">
        <div class="field-label">Search GHL Contacts</div>
        <input type="text" id="contactSearch" placeholder="Start typing a name…" autocomplete="off">
        <div class="results" id="results"></div>
        <div class="selected-chip" id="selectedChip"><span id="chipLabel"></span><button class="chip-x" id="chipX">✕</button></div>
      </div>
    </div>
  </div>
  <div class="pill-card">
    <div class="pill-header">Transaction Deadlines</div>
    <div class="pill-body">
      <div id="dlBox"><div class="dl-empty">Search for a contact to view their deadlines.</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
  if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(()=>{}); }
  if (window.caches && caches.keys) { caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(()=>{}); }
  const user = JSON.parse(sessionStorage.getItem('lexpro_user') || localStorage.getItem('lexpro_user') || '{}');
  if (!user.username) window.location.href = 'index.html';
  document.getElementById('backBtn').addEventListener('click', function(e) {
    if (document.referrer && history.length > 1) { e.preventDefault(); history.back(); }
  });
  const toast = document.getElementById('toast');
  function showToast(msg, type='') { toast.textContent = msg; toast.className = 'toast show' + (type ? ' '+type : ''); setTimeout(() => { toast.className = 'toast'; }, 3500); }
  function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── CONTACT SEARCH ──
  let searchTimer = null;
  const searchInput = document.getElementById('contactSearch');
  const resultsBox = document.getElementById('results');
  const chip = document.getElementById('selectedChip');
  const chipLabel = document.getElementById('chipLabel');
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const q = searchInput.value.trim();
    if (q.length < 2) { resultsBox.classList.remove('open'); return; }
    searchTimer = setTimeout(async () => {
      try {
        const res = await fetch('/.netlify/functions/search-contacts?query=' + encodeURIComponent(q));
        const data = await res.json();
        const contacts = data.contacts || [];
        resultsBox.innerHTML = '';
        if (!contacts.length) resultsBox.innerHTML = '<div class="result-item"><div class="result-name">No contacts found</div></div>';
        else contacts.forEach(c => {
          const nm = ((c.firstName || '') + ' ' + (c.lastName || '')).trim() || c.contactName || 'Unnamed';
          const item = document.createElement('div');
          item.className = 'result-item';
          item.innerHTML = `<div class="result-name">${esc(nm)}</div><div class="result-phone">${esc(c.phone || 'no phone on file')}</div>`;
          item.addEventListener('click', () => {
            chipLabel.textContent = nm;
            chip.classList.add('show');
            searchInput.value = ''; searchInput.style.display = 'none';
            resultsBox.classList.remove('open');
            loadDeadlines(c.id);
          });
          resultsBox.appendChild(item);
        });
        resultsBox.classList.add('open');
      } catch (e) { resultsBox.classList.remove('open'); }
    }, 350);
  });
  document.addEventListener('click', e => { if (!e.target.closest('.contact-box')) resultsBox.classList.remove('open'); });
  document.getElementById('chipX').addEventListener('click', () => {
    chip.classList.remove('show');
    searchInput.style.display = ''; searchInput.focus();
    document.getElementById('dlBox').innerHTML = '<div class="dl-empty">Search for a contact to view their deadlines.</div>';
  });

  // ── DEADLINES: >5d normal · ≤5 yellow · ≤3 red · closing blue ──
  function daysOut(dateStr) {
    if (!dateStr) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(dateStr + 'T00:00:00');
    return Math.round((d - today) / 86400000);
  }
  function fmtDate(dateStr) {
    if (!dateStr) return '';
    return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  async function loadDeadlines(contactId) {
    const box = document.getElementById('dlBox');
    box.innerHTML = '<div class="dl-empty">Loading deadlines…</div>';
    try {
      const res = await fetch('/.netlify/functions/get-calendar?contactId=' + contactId);
      const data = await res.json();
      const appts = data.appointments || [];
      if (!appts.length) { box.innerHTML = '<div class="dl-empty">No upcoming deadlines for this contact.</div>'; return; }
      appts.sort((a, b) => new Date(a.startTime) - new Date(b.startTime));
      const list = document.createElement('div');
      list.className = 'dl-list';
      appts.forEach(appt => {
        const dateStr = appt.startTime ? appt.startTime.split('T')[0] : '';
        const days = daysOut(dateStr);
        const isClosing = (appt.title || '').toLowerCase().includes('closing');
        let rowCls = '', badgeCls = 'b-ok', badgeTxt = days === null ? '' : days + 'd';
        if (isClosing) { rowCls = 'closing'; badgeCls = 'b-closing'; badgeTxt = 'Closing'; }
        else if (days !== null) {
          if (days < 0) { rowCls = 'urgent'; badgeCls = 'b-urgent'; badgeTxt = Math.abs(days) + 'd overdue'; }
          else if (days <= 3) { rowCls = 'urgent'; badgeCls = 'b-urgent'; badgeTxt = days === 0 ? 'Today' : days + 'd'; }
          else if (days <= 5) { rowCls = 'soon'; badgeCls = 'b-soon'; }
        }
        const row = document.createElement('div');
        row.className = 'dl-row' + (rowCls ? ' ' + rowCls : '');
        row.innerHTML = `<div class="dl-label">${esc(appt.title || 'Appointment')}</div>
          <div class="dl-right"><div class="dl-date">${fmtDate(dateStr)}</div>
          ${days !== null ? `<div class="dl-badge ${badgeCls}">${badgeTxt}</div>` : ''}</div>`;
        list.appendChild(row);
      });
      box.innerHTML = '';
      box.appendChild(list);
    } catch (err) {
      box.innerHTML = '<div class="dl-empty">Could not load deadlines — try again.</div>';
    }
  }
</script>
</body>
</html>
