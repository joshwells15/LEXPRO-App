<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>LexPro | Escalations</title>
<style>
  :root {
    --bg:#ffffff; --surface:#f7f7f7; --surface-2:#f0f0f0; --border:#e8e8e8;
    --primary:#111111; --text:#111111; --text-muted:#666666; --text-hint:#999999;
    --green:#1a7f37; --red:#cc2233; --amber:#a05a00;
    --font:'Outfit',-apple-system,sans-serif; --r-sm:10px; --r-md:14px; --r-lg:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{min-height:100vh;background:var(--bg);font-family:var(--font);color:var(--text);}
  .header{padding:18px 20px 12px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5;}
  .back-btn{width:42px;height:42px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex-shrink:0;}
  .back-btn svg{width:18px;height:18px;stroke:var(--text-muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .page-title{font-size:22px;font-weight:700;letter-spacing:-0.3px;}
  .page-sub{font-size:12px;color:var(--text-hint);margin-top:2px;}
  .list{padding:16px 20px 60px;display:flex;flex-direction:column;gap:12px;}
  .esc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;}
  .esc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .esc-kind{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;padding:4px 8px;border-radius:6px;background:#fdf3e7;color:var(--amber);border:1px solid #f2dfc4;flex-shrink:0;}
  .esc-time{font-size:11px;color:var(--text-hint);}
  .esc-summary{font-size:15px;font-weight:600;line-height:1.35;margin-top:10px;}
  .esc-detail{font-size:13px;color:var(--text-muted);margin-top:8px;line-height:1.45;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;}
  .esc-agent{font-size:12px;color:var(--text-hint);margin-top:8px;}
  .esc-agent a{color:var(--text);font-weight:600;text-decoration:none;}
  .btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .btn{flex:1;min-width:110px;padding:12px 8px;border:none;border-radius:var(--r-md);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-outline{background:var(--bg);color:var(--text-muted);border:1px solid var(--border);}
  .btn-danger{background:#fbe9ec;color:var(--red);border:1px solid #f2ccd3;}
  .counter-row{display:none;gap:8px;margin-top:10px;align-items:center;}
  .counter-row.open{display:flex;}
  .counter-row input{flex:1;padding:11px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);font-family:var(--font);font-size:14px;}
  .msg{text-align:center;font-size:12px;margin-top:8px;min-height:14px;}
  .msg.ok{color:var(--green);} .msg.err{color:var(--red);}
  .empty{text-align:center;color:var(--text-hint);font-size:13px;padding:60px 20px;line-height:1.6;}
  .empty .big{font-size:34px;margin-bottom:10px;}
  .recent-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-hint);margin:22px 0 4px;}
  .recent-item{font-size:12px;color:var(--text-hint);padding:8px 2px;border-bottom:1px solid var(--surface-2);}
  .loading{text-align:center;color:var(--text-hint);font-size:13px;padding:50px 0;}
</style>
</head>
<body>

<div class="header">
  <a class="back-btn" href="tanya-home.html" onclick="if(!document.referrer.includes('tanya')){this.href='home.html'}">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div>
    <div class="page-title">Escalations</div>
    <div class="page-sub">Things that need a human</div>
  </div>
</div>

<div class="list" id="list"><div class="loading">Loading…</div></div>

<script>
  const user = JSON.parse(localStorage.getItem('lexpro_user') || sessionStorage.getItem('lexpro_user') || '{}');
  if (!user.username) window.location.href = 'index.html';

  const API = '/.netlify/functions/resolve-escalation';
  const KIND_LABELS = {
    seller_unreachable: 'Seller unreachable',
    unmatched_address: 'Unknown property',
    stuck_intake: 'Stuck conversation',
    walking_away: 'Agent walked away',
    chase_exhausted: 'No feedback',
    feedback_no_row: 'Feedback to log',
    property_question: 'Question to answer',
    other: 'Needs a look'
  };

  const $ = id => document.getElementById(id);

  function timeAgo(iso) {
    const m = Math.round((Date.now() - new Date(iso)) / 60000);
    if (m < 60) return m + 'm ago';
    const h = Math.round(m / 60);
    if (h < 24) return h + 'h ago';
    return Math.round(h / 24) + 'd ago';
  }

  function actionsFor(e) {
    if (e.kind === 'seller_unreachable' && e.request_id) {
      return `
        <div class="btn-row">
          <button class="btn btn-primary" onclick="act('${e.id}','seller_yes',this)">Seller said YES</button>
          <button class="btn btn-outline" onclick="toggleCounter('${e.id}')">Different time</button>
          <button class="btn btn-danger" onclick="act('${e.id}','cancel_request',this)">Cancel it</button>
        </div>
        <div class="counter-row" id="counter-${e.id}">
          <input type="date" id="cd-${e.id}">
          <input type="time" id="ct-${e.id}">
          <button class="btn btn-primary" style="flex:0 0 auto" onclick="counter('${e.id}',this)">Send</button>
        </div>`;
    }
    if (['unmatched_address','stuck_intake'].includes(e.kind)) {
      return `
        <div class="btn-row">
          <button class="btn btn-primary" onclick="act('${e.id}','handled',this)">Handled — let Donna resume</button>
          <button class="btn btn-outline" onclick="act('${e.id}','dismiss',this)">Dismiss</button>
        </div>`;
    }
    return `
      <div class="btn-row">
        <button class="btn btn-primary" onclick="act('${e.id}','dismiss',this)">Done — dismiss</button>
      </div>`;
  }

  function render(open, recent) {
    const el = $('list');
    if (!open.length) {
      el.innerHTML = `<div class="empty"><div class="big">✅</div>All clear.<br>Nothing needs you right now.</div>` + recentHtml(recent);
      return;
    }
    el.innerHTML = open.map(e => `
      <div class="esc-card" id="card-${e.id}">
        <div class="esc-top">
          <span class="esc-kind">${KIND_LABELS[e.kind] || e.kind}</span>
          <span class="esc-time">${timeAgo(e.created_at)}</span>
        </div>
        <div class="esc-summary">${e.summary}</div>
        ${e.detail ? `<div class="esc-detail">${e.detail}</div>` : ''}
        ${e.agent_name || e.agent_phone ? `<div class="esc-agent">${e.agent_name || 'Agent'}${e.agent_phone ? ` — ${e.agent_phone} &nbsp;<a href="tel:${e.agent_phone}" style="font-weight:700">📞 Call</a>&nbsp; <a href="sms:${e.agent_phone}" style="font-weight:700">💬 Text</a>` : ''}</div>` : ''}
        ${actionsFor(e)}
        <div class="msg" id="msg-${e.id}"></div>
      </div>`).join('') + recentHtml(recent);
  }

  function recentHtml(recent) {
    if (!recent || !recent.length) return '';
    return `<div class="recent-title">Recently handled</div>` +
      recent.map(r => `<div class="recent-item">${KIND_LABELS[r.kind] || r.kind}: ${r.summary} — ${r.resolved_action}</div>`).join('');
  }

  window.toggleCounter = id => $('counter-' + id).classList.toggle('open');

  async function post(body) {
    const r = await fetch(API, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    return r.json();
  }

  window.act = async (id, action, btn) => {
    btn.disabled = true;
    const msg = $('msg-' + id);
    msg.className = 'msg'; msg.textContent = 'Working…';
    try {
      const d = await post({ id, action });
      if (!d.ok) throw new Error(d.error);
      msg.className = 'msg ok'; msg.textContent = 'Done ✓';
      setTimeout(load, 700);
    } catch (e) {
      msg.className = 'msg err'; msg.textContent = e.message;
      btn.disabled = false;
    }
  };

  window.counter = async (id, btn) => {
    const date = $('cd-' + id).value, time = $('ct-' + id).value;
    const msg = $('msg-' + id);
    if (!time) { msg.className = 'msg err'; msg.textContent = 'Pick a time'; return; }
    btn.disabled = true;
    msg.className = 'msg'; msg.textContent = 'Sending…';
    try {
      const d = await post({ id, action: 'seller_counter', time, date });
      if (!d.ok) throw new Error(d.error);
      msg.className = 'msg ok'; msg.textContent = 'Sent to the agent ✓';
      setTimeout(load, 700);
    } catch (e) {
      msg.className = 'msg err'; msg.textContent = e.message;
      btn.disabled = false;
    }
  };

  async function load() {
    try {
      const r = await fetch(API);
      const d = await r.json();
      if (!d.ok) throw new Error(d.error);
      render(d.open || [], d.recent || []);
    } catch (e) {
      $('list').innerHTML = '<div class="empty">Could not load. Pull to refresh.</div>';
    }
  }
  load();
  setInterval(load, 60000);
</script>
</body>
</html>
