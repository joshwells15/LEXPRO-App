<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LexPro">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>LexPro | Morning Brief</title>
<style>
  :root {
    --bg:#ffffff; --surface:#f7f7f7; --surface-2:#f0f0f0; --border:#e8e8e8;
    --primary:#111111; --text:#111111; --text-muted:#666666; --text-hint:#999999;
    --font:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif;
    --radius-sm:10px; --radius-md:14px; --radius-lg:20px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { min-height:100vh; background:var(--bg); font-family:var(--font); color:var(--text); display:flex; flex-direction:column; }
  .header { padding:14px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border); }
  .hdr-logo { display:flex; align-items:center; flex-shrink:0; }
  .hl-lex { font-size:16px; font-weight:700; color:var(--primary); letter-spacing:2px; line-height:1; }
  .hl-pro-box { border:2px solid var(--primary); border-radius:5px; padding:1px 5px; margin-left:3px; }
  .hl-pro { font-size:16px; font-weight:700; color:var(--primary); letter-spacing:2px; line-height:1; display:block; }
  .hdr-name { flex:1; font-size:17px; font-weight:700; letter-spacing:-0.3px; }
  .hdr-icons { display:flex; gap:8px; align-items:center; }
  .icon-btn { width:40px; height:40px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center; cursor:pointer; text-decoration:none; font-size:18px;
    font-family:var(--font); transition:background 0.15s; position:relative; }
  .icon-btn:active { background:var(--surface-2); }
  .settings-wrap { position:relative; }
  .settings-menu { display:none; position:absolute; right:0; top:46px; background:var(--bg); border:1px solid var(--border);
    border-radius:var(--radius-md); box-shadow:0 8px 24px rgba(0,0,0,0.12); overflow:hidden; z-index:50; min-width:170px; }
  .settings-menu.open { display:block; }
  .settings-item { display:block; width:100%; padding:13px 16px; background:none; border:none; text-align:left;
    font-family:var(--font); font-size:14px; color:var(--text); cursor:pointer; text-decoration:none; }
  .settings-item:active { background:var(--surface); }
  .settings-item + .settings-item { border-top:1px solid var(--border); }
  .back-btn { width:40px; height:40px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center; text-decoration:none; flex-shrink:0; font-size:18px; color:var(--text-muted); }
  .main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 24px 48px; gap:14px; }
  .logo-area { text-align:center; margin-bottom:12px; }
  .logo-mark { display:inline-flex; align-items:center; justify-content:center; margin-bottom:8px; }
  .logo-lex { font-size:38px; font-weight:700; color:var(--primary); letter-spacing:4px; line-height:1; }
  .logo-pro-box { border:3px solid var(--primary); border-radius:9px; padding:3px 10px; margin-left:7px; }
  .logo-pro { font-size:38px; font-weight:700; color:var(--primary); letter-spacing:4px; line-height:1; display:block; }
  .logo-sub { font-size:10px; color:var(--text-hint); text-transform:uppercase; letter-spacing:0.22em; margin-top:6px; }
  .footer { text-align:center; padding:0 0 32px; font-size:11px; color:var(--text-hint); letter-spacing:0.08em; text-transform:uppercase; }

  .brief-wrap { flex:1; overflow-y:auto; padding:20px 16px 32px; max-width:560px; margin:0 auto; width:100%; }
  .brief-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:18px; font-size:15px; line-height:1.6; white-space:pre-wrap; }
  .brief-card strong { font-weight:600; }
  .loading { text-align:center; color:var(--text-hint); padding:48px 0; font-size:14px; }
  .speak-btn { width:100%; max-width:560px; margin:12px auto 0; display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px;
    font-family:var(--font); font-size:14px; color:var(--text-muted); cursor:pointer; }
</style>
</head>
<body>
<div class="header">
  <a class="back-btn" href="tanya-home.html" id="backBtn">‹</a>
  <div class="hdr-name">🌞 Good Morning Brief</div>
  <div class="hdr-icons">
    <a class="icon-btn" href="calendar.html" title="Calendar">📆</a>
    <div class="settings-wrap">
      <button class="icon-btn" id="gearBtn" title="Settings">⚙️</button>
      <div class="settings-menu" id="gearMenu">
        <a class="settings-item" href="change-password.html">Change Password</a>
        <button class="settings-item" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>
</div>
<div class="brief-wrap">
  <div class="loading" id="loading">Pulling your brief…</div>
  <div class="brief-card" id="briefCard" style="display:none;"></div>
  <button class="speak-btn" id="speakBtn" style="display:none;">🔊 Read aloud</button>
</div>
<script>
  // ── SERVICE WORKER EXORCISM: unregister all workers + purge caches (permanent cache-bust fix) ──
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(()=>{});
  }
  if (window.caches && caches.keys) {
    caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(()=>{});
  }
  const user = JSON.parse(sessionStorage.getItem('lexpro_user') || localStorage.getItem('lexpro_user') || '{}');
  if (!user.username) window.location.href = 'index.html';
  const gearBtn = document.getElementById('gearBtn');
  const gearMenu = document.getElementById('gearMenu');
  gearBtn.addEventListener('click', e => { e.stopPropagation(); gearMenu.classList.toggle('open'); });
  document.addEventListener('click', () => gearMenu.classList.remove('open'));
  function logout() {
    sessionStorage.removeItem('lexpro_user');
    localStorage.removeItem('lexpro_remember');
    localStorage.removeItem('lexpro_user');
    window.location.href = 'index.html';
  }

  function fmt(t){return t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
  let briefText = '';
  (async () => {
    try {
      const res = await fetch('/.netlify/functions/tanya-morning-brief', {
        method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
      const data = await res.json();
      briefText = data.brief || 'Had trouble pulling your brief — go back and try again.';
    } catch(e) { briefText = 'Connection hiccup — go back and try again.'; }
    document.getElementById('loading').style.display = 'none';
    const card = document.getElementById('briefCard');
    card.innerHTML = fmt(briefText);
    card.style.display = 'block';
    const sb = document.getElementById('speakBtn');
    sb.style.display = 'flex';
    if (window.speechSynthesis) {
      const utt = new SpeechSynthesisUtterance(briefText);
      utt.rate = 0.92;
      const voices = window.speechSynthesis.getVoices();
      const pref = voices.find(v=>v.name==='Samantha')||voices.find(v=>v.name==='Karen')||voices.find(v=>/en/i.test(v.lang));
      if (pref) utt.voice = pref;
      window.speechSynthesis.speak(utt);
    }
    sb.addEventListener('click', () => {
      if (window.speechSynthesis.speaking) { window.speechSynthesis.cancel(); sb.innerHTML='🔊 Read aloud'; return; }
      const u = new SpeechSynthesisUtterance(briefText); u.rate = 0.92;
      sb.innerHTML='🔇 Stop'; u.onend=()=>{sb.innerHTML='🔊 Read aloud';};
      window.speechSynthesis.speak(u);
    });
  })();
</script>
</body>
</html>
